[package]
name = "secp256k1-signature"
version.workspace = true
edition = "2021"

[dependencies]
arch_sdk = "0.10.0"
arch_program = "0.10.0"

hex = "0.4.3"
borsh = { version = "1.4.0", features = ["derive"] }
libsecp256k1 = { version = "0.7.0", features = ["hmac"] }
sha256 = "1.5.0"

[dev-dependencies]
serial_test = "3.1.1"

[lib]
path = "src/lib.rs"
